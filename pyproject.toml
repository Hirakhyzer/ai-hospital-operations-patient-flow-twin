[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hospitaltwin"
version = "0.1.0"
description = "Synthetic AI hospital operations and patient-flow digital twin"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hirakhyzer" }]
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
