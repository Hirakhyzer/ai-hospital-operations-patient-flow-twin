<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AI Hospital Operations and Patient Flow Digital Twin banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="20%" r="72%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <style>
      .title{font:800 41px Arial,Helvetica,sans-serif;fill:#f8fafc;letter-spacing:-.5px}
      .sub{font:700 21px Arial,Helvetica,sans-serif;fill:#fecaca}
      .body{font:500 15.5px Arial,Helvetica,sans-serif;fill:#dbeafe}
      .chip{font:700 13px Arial,Helvetica,sans-serif;fill:#fff7ed}
      .tiny{font:500 12px Arial,Helvetica,sans-serif;fill:#cbd5e1}
      .cardLabel{font:700 14px Arial,Helvetica,sans-serif;fill:#fee2e2}
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>

  <g opacity="0.13" stroke="#f8fafc" stroke-width="1.1" fill="none">
    <path d="M70 102 C204 54 332 146 488 92 C668 28 808 112 976 146 C1066 164 1128 140 1162 112"/>
    <path d="M70 266 C206 218 342 300 488 252 C668 196 810 248 956 286 C1042 308 1112 282 1164 238"/>
    <path d="M122 72 L290 134 L462 84 L656 176 L850 92 L1068 164"/>
  </g>

  <g transform="translate(72 72)">
    <text class="title" x="0" y="48">AI Hospital Operations Digital Twin</text>
    <text class="sub" x="0" y="88">Patient Flow • Capacity Pressure • Safe Planning Review</text>
    <text class="body" x="0" y="126">Synthetic hospital lab for ED arrivals, beds, ICU pressure, staffing workload, delays, equity, and scenario comparison.</text>

    <g transform="translate(0 166)">
      <rect x="0" y="0" width="124" height="32" rx="16" fill="#991b1b" opacity="0.95"/>
      <text class="chip" x="62" y="21" text-anchor="middle">Patient Flow</text>
      <rect x="142" y="0" width="142" height="32" rx="16" fill="#1d4ed8" opacity="0.95"/>
      <text class="chip" x="213" y="21" text-anchor="middle">Bed Capacity</text>
      <rect x="302" y="0" width="124" height="32" rx="16" fill="#7c3aed" opacity="0.95"/>
      <text class="chip" x="364" y="21" text-anchor="middle">Staff Audit</text>
      <rect x="444" y="0" width="146" height="32" rx="16" fill="#0f766e" opacity="0.95"/>
      <text class="chip" x="517" y="21" text-anchor="middle">Scenario Review</text>
    </g>

    <text class="tiny" x="0" y="238">Synthetic planning-support scaffold only — not triage, diagnosis, bed-command, dispatch, or clinical decision software.</text>
  </g>

  <g transform="translate(875 76)" filter="url(#shadow)">
    <rect x="0" y="0" width="252" height="202" rx="26" fill="#020617" opacity="0.72" stroke="#374151"/>
    <g transform="translate(36 40)">
      <rect x="20" y="18" width="72" height="48" rx="10" fill="#1d4ed8" opacity="0.92"/>
      <rect x="104" y="18" width="72" height="48" rx="10" fill="#991b1b" opacity="0.92"/>
      <rect x="20" y="82" width="72" height="48" rx="10" fill="#0f766e" opacity="0.92"/>
      <rect x="104" y="82" width="72" height="48" rx="10" fill="#7c3aed" opacity="0.92"/>
      <path d="M92 42 H104 M56 66 V82 M140 66 V82 M92 106 H104" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
      <circle cx="56" cy="42" r="7" fill="#bfdbfe"/>
      <circle cx="140" cy="42" r="7" fill="#fecaca"/>
      <circle cx="56" cy="106" r="7" fill="#a7f3d0"/>
      <circle cx="140" cy="106" r="7" fill="#ddd6fe"/>
    </g>
    <text class="cardLabel" x="126" y="188" text-anchor="middle">Operational Intelligence</text>
  </g>
</svg>